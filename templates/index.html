<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes cinematicWeatherCycle {
            0%, 33% {
                background: linear-gradient(135deg, #b45309, #78350f, #18181b); /* Fine / Sun warm glow */
            }
            34%, 66% {
                background: linear-gradient(135deg, #0369a1, #1e3a8a, #0f172a); /* Cloudy Rain deep blue */
            }
            67%, 100% {
                background: linear-gradient(135deg, #334155, #1e293b, #020617); /* Snow icy dark slate */
            }
        }

        .animated-weather-bg {
            animation: cinematicWeatherCycle 15s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.8)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(251, 191, 36, 1)); }
        }

        .weather-icon-anim {
            animation: pulseGlow 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="animated-weather-bg min-h-screen flex items-center justify-center p-4 transition-all duration-1000">

    <div class="bg-slate-900/80 backdrop-blur-xl border border-white/10 shadow-2xl rounded-3xl p-8 w-full max-w-md text-white">
        <h1 class="text-3xl font-extrabold text-center mb-6 flex items-center justify-center gap-2 tracking-wide">
            <span class="weather-icon-anim inline-block">☀️</span> Weather Finder
        </h1>

        <form method="POST" class="flex gap-2 mb-6">
            <input 
                type="text" 
                name="city" 
                placeholder="Enter city name..." 
                required
                class="flex-1 px-4 py-3 bg-white/10 border border-white/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400 text-white placeholder-gray-400"
            >
            <button 
                type="submit" 
                class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-6 py-3 rounded-xl transition duration-200 shadow-md">
                Search
            </button>
        </form>

        {% if error %}
            <div class="bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded-xl mb-4 text-center">
                {{ error }}
            </div>
        {% endif %}

        {% if weather %}
            <div class="bg-white/10 border border-white/10 rounded-2xl p-6 text-center shadow-inner backdrop-blur-md">
                <h2 class="text-2xl font-bold mb-1">{{ weather.name }}, {{ weather.sys.country }}</h2>
                <p class="text-gray-300 capitalize mb-4">{{ weather.weather[0].description }}</p>
                
                <div class="text-5xl font-extrabold text-amber-400 mb-4">
                    {{ weather.main.temp }}°C
                </div>

                <div class="grid grid-cols-2 gap-4 text-sm text-gray-300 border-t border-white/10 pt-4">
                    <div>
                        <span class="block font-semibold text-white">Humidity</span>
                        {{ weather.main.humidity }}%
                    </div>
                    <div>
                        <span class="block font-semibold text-white">Wind Speed</span>
                        {{ weather.wind.speed }} m/s
                    </div>
                </div>
            </div>
        {% endif %}
    </div>

</body>
</html>
