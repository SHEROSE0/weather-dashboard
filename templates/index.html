<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Weather Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4 text-white">

    <div class="bg-slate-900/90 backdrop-blur-xl border border-white/15 shadow-2xl rounded-3xl p-8 w-full max-w-md">
        <h1 class="text-3xl font-extrabold text-center mb-6 flex items-center justify-center gap-2">
            <span>🌍</span> Weather Finder
        </h1>

        <form method="POST" class="flex gap-2 mb-6">
            <input 
                type="text" 
                name="city" 
                placeholder="Enter city name (e.g. London, Oslo)..." 
                required
                class="flex-1 px-4 py-3 bg-white/10 border border-white/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400 text-white placeholder-gray-400"
            >
            <button 
                type="submit" 
                class="bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold px-6 py-3 rounded-xl transition duration-200 shadow-md">
                Search
            </button>
        </form>

        {% if error %}
            <div class="bg-red-500/20 border border-red-500 text-red-200 px-4 py-3 rounded-xl mb-4 text-center text-sm">
                {{ error }}
            </div>
        {% endif %}

        {% if weather %}
            <div class="bg-white/10 border border-white/10 rounded-2xl p-6 text-center shadow-inner backdrop-blur-md">
                
                <!-- Dynamic Weather Icon from OpenWeatherMap API -->
                <div class="flex justify-center mb-2">
                    <img src="http://openweathermap.org/img/wn/{{ weather.weather[0].icon }}@4x.png" alt="Weather Icon" class="w-28 h-28 drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)]">
                </div>

                <h2 class="text-2xl font-bold mb-1">{{ weather.name }}, {{ weather.sys.country }}</h2>
                <p class="text-sky-300 font-medium capitalize text-lg mb-4">{{ weather.weather[0].description }}</p>
                
                <div class="text-6xl font-black text-white mb-6 tracking-tight">
                    {{ weather.main.temp }}°C
                </div>

                <div class="grid grid-cols-2 gap-4 text-sm text-gray-300 border-t border-white/15 pt-4">
                    <div class="bg-white/5 p-3 rounded-xl">
                        <span class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Humidity</span>
                        <span class="text-lg font-bold text-white">{{ weather.main.humidity }}%</span>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl">
                        <span class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Wind Speed</span>
                        <span class="text-lg font-bold text-white">{{ weather.wind.speed }} m/s</span>
                    </div>
                </div>
            </div>
        {% endif %}
    </div>

</body>
</html>
